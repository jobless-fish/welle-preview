    ' vec3 glc=vec3(0.); float shade=0.;',
    ' for(int i=0;i<MAXG;i++){',
    '  if(float(i)>=uGN) break;',
    '  vec4 g=uG[i];',
    '  vec2 gp=uRect.xy+vec2(g.x-.5,.5-g.y)*2.*uRect.zw;',
    '  float sz0=g.w*uRect.z;',
    // 주기마다 번쩍일지, 언제·얼마나·어느 크기로 번쩍일지 무작위로 정함
    '  float spd=.22+fract(g.z*7.13)*.28;',
    '  float ct=t*spd+g.z*13.;',
    '  float ci=floor(ct), cf=fract(ct);',
    '  float r1=hash(vec2(ci,g.z*31.)), r2=hash(vec2(ci+7.,g.z*17.)), r3=hash(vec2(ci+3.,g.z*53.));',
    '  float on=step(.28,r1);',
    '  float pulse=on*exp(-pow((cf-(.2+r2*.6))*(3.2+r3*5.),2.))*(.55+.45*r3);',
    '  float sz=sz0*(.65+.6*r2);',
    '  vec2 jit=(vec2(hash(vec2(ci,g.z+1.)),hash(vec2(g.z+2.,ci)))-.5)*sz0*.3;',
    '  vec2 dd=gq-gp-jit;',
    '  float flick=.7+.3*sin(t*(17.+g.z*13.)+r2*40.)*sin(t*(23.+r1*9.));',
    '  float amp=(.03+pulse)*flick;',
'  float rr=length(dd)/sz;',
    '  float core=exp(-rr*rr*140.);',
    '  float halo=exp(-rr*8.)*.45;',
    // 빛 번짐 십자(가로가 더 길게) + 살짝 기운 보조선
    '  float sx=exp(-abs(dd.y)/sz*110.)*exp(-abs(dd.x)/sz*1.5);',
    '  float sy=exp(-abs(dd.x)/sz*110.)*exp(-abs(dd.y)/sz*2.6);',
    '  vec2 dr=mat2(.866,.5,-.5,.866)*dd;',
    '  float sd=exp(-abs(dr.y)/sz*140.)*exp(-abs(dr.x)/sz*4.5)*.35;',
    '  float star=(sx+sy*.6+sd)*pulse;',
    // 밝은 배경에서도 빛이 서도록, 주변에 아주 옅은 굴절 그늘
    '  shade+=exp(-rr*2.6)*.2*pulse;',
    // 가장자리 미세한 분광(실제 렌즈 빛처럼)
    '  vec3 disp3=vec3(exp(-rr*7.),exp(-rr*8.5),exp(-rr*10.))*.25*pulse;',
    '  glc+=amp*vec3(core*2.6+halo+star*1.1)+disp3;',
    ' }',
    ' float gk=uGlintAmt*(1.-smoothstep(0.,.5,P))*uIn*uGIn;',
    ' col=mix(col,col*vec3(.80,.87,.96),clamp(shade*gk,0.,.45));',
    ' col+=glc*uGlint*gk;',

    // 페이지 드러내기: 터치 지점부터 물이 걷히듯
    ' float m=fbm(p*2.5+t*.1)*.6+d*.6;',
    ' float rev=smoothstep(.35,1.,P)*1.8-.1;',
    ' float A=1.-smoothstep(m-.12,m+.12,rev);',
    ' gl_FragColor=vec4(col*A,A);',
    '}'
  ].join('\n');

  function sh(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.warn(gl.getShaderInfoLog(s)); return null; }
    return s;
  }
  var vs = sh(gl.VERTEX_SHADER, VS), fs = sh(gl.FRAGMENT_SHADER, FS);
  if (!vs || !fs) { gl = null; fallback(); return; }
  var prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { gl = null; fallback(); return; }
  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  var aLoc = gl.getAttribLocation(prog, 'a');
  gl.enableVertexAttribArray(aLoc);
  gl.vertexAttribPointer(aLoc, 2, gl.FLOAT, false, 0, 0);

  var U = {};
  ['uR', 'uRes', 'uTime', 'uP', 'uStart', 'uIn', 'uGIn', 'uPt', 'uRect', 'uLogo', 'uTop', 'uBot', 'uGlint', 'uInk',
   'uGlintAmt', 'uWave', 'uWS', 'uGN', 'uG']
    .forEach(function (n) { U[n] = gl.getUniformLocation(prog, n); });

  gl.uniform3fv(U.uTop, hexToRgb(CONFIG.waterTop));
  gl.uniform3fv(U.uBot, hexToRgb(CONFIG.waterBottom));
  gl.uniform3fv(U.uGlint, hexToRgb(CONFIG.glintColor));
  gl.uniform3fv(U.uInk, hexToRgb(CONFIG.inkTint));
  gl.uniform1f(U.uGlintAmt, CONFIG.glintAmount);
  gl.uniform1f(U.uWave, CONFIG.waveAmount);
  gl.uniform1f(U.uWS, CONFIG.waveSpeed);
  gl.uniform1f(U.uGN, 0);
  gl.uniform1i(U.uLogo, 0);

  var tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0, 0, 0, 0]));

  var readyAt = -1, glintAt = -1;
  var svg = prepSVG(CONFIG.logoSVG);
  var logoAspect = svg.w / svg.h;
  var img = new Image();
  img.onload = function () {
    var c = document.createElement('canvas');
    c.width = svg.w; c.height = svg.h;
    var ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0, svg.w, svg.h);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);

    readyAt = now();

    // 로고는 바로 띄우고, 윤슬 위치 계산은 다음 틱으로 미룸
    setTimeout(function () {
      var alpha = null;
      try { alpha = ctx.getImageData(0, 0, svg.w, svg.h).data; } catch (e) {}
      var bends = findBends(svg, alpha);
      var arr = new Float32Array(MAXG * 4);
      for (var i = 0; i < bends.length; i++) arr.set(bends[i], i * 4);
      gl.useProgram(prog);
      gl.uniform4fv(U.uG, arr);
      gl.uniform1f(U.uGN, bends.length);
      glintAt = now();
    }, 30);
  };
  img.onerror = function () { readyAt = now(); };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg.str);


  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.max(1, Math.round(cv.clientWidth * dpr));
    var h = Math.max(1, Math.round(cv.clientHeight * dpr));
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    gl.viewport(0, 0, w, h);
    var asp = w / h, la = logoAspect;
    var hw = logoSize() * Math.min(asp, 1) / 2, hh = hw / la;
    if (hh > 0.3) { hh = 0.3; hw = hh * la; }
    gl.uniform2f(U.uRes, w, h);
    gl.uniform4f(U.uRect, 0, 0.02, hw, hh);
  }

  function ease(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }

  var startAt = -1, firstFrame = true, dur = CONFIG.duration;
  function frame() {
    if (finished) return;
    resize();
    var t = now();
    var shown = readyAt >= 0 ? t - readyAt : 0;

    if (!started && readyAt >= 0 && (
          (rushed && shown >= CONFIG.rushMinShow) ||
          (interactAt >= 0 && shown >= CONFIG.minShow && t - interactAt >= CONFIG.interactTime))) {
      started = true; startAt = t; dur = rushed ? CONFIG.rushDuration : CONFIG.duration;
      emit('inkintro:reveal');
    }
    var raw = started ? Math.min((t - startAt) / dur, 1) : 0;
    if (raw > CONFIG.unlockAt) unlock();

    gl.uniform1f(U.uTime, t);
    gl.uniform1f(U.uP, ease(raw));
    gl.uniform1f(U.uStart, started ? startAt : 1e5);
    gl.uniform1f(U.uIn, readyAt >= 0 ? Math.min(shown / 0.7, 1) : 0);
    gl.uniform1f(U.uGIn, glintAt >= 0 ? Math.min((t - glintAt) / 1.2, 1) : 0);
    gl.uniform2f(U.uPt, pointer[0], pointer[1]);
    var ra = new Float32Array(MAXR * 4);
    for (var ri = 0; ri < ripples.length; ri++) ra.set([ripples[ri].x, ripples[ri].y, ripples[ri].t, ripples[ri].s], ri * 4);
    gl.uniform4fv(U.uR, ra);

    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    if (firstFrame) { firstFrame = false; wrap.style.background = 'transparent'; }
    if (raw >= 1) { finish(); return; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------- WebGL 미지원 시: 간단한 페이드 ---------- */
  function fallback() {
    wrap.style.display = 'flex';
    wrap.style.alignItems = 'center';
    wrap.style.justifyContent = 'center';
    wrap.style.background = 'linear-gradient(' + CONFIG.waterTop + ',' + CONFIG.waterBottom + ')';
    wrap.style.transition = 'opacity 1.2s ease, filter 1.2s ease';
    if (cv.parentNode) cv.parentNode.removeChild(cv);
    var holder = document.createElement('div');
    holder.style.cssText = 'width:' + (logoSize() * 100) + 'vmin;max-height:60vh;';
    holder.innerHTML = CONFIG.logoSVG;
    var s = holder.querySelector('svg');
    if (s) { s.style.width = '100%'; s.style.height = 'auto'; }
    wrap.appendChild(holder);
    readyAt = now();
    (function wait() {
      if (finished) return;
      var tn = now();
      if ((rushed && tn - readyAt >= CONFIG.rushMinShow) ||
          (interactAt >= 0 && tn - readyAt >= CONFIG.minShow && tn - interactAt >= CONFIG.interactTime)) {
        emit('inkintro:reveal'); unlock();
        wrap.style.opacity = '0';
        wrap.style.filter = 'blur(12px)';
        setTimeout(finish, 1300);
        return;
      }
      requestAnimationFrame(wait);
    })();
  }
})();
</script>
