# 아임웹 'Gallery' 상품 → 사이트 갤러리 자동 반영
# - 30분마다 + 수동 실행(Actions 탭 → Run workflow) + 이 파일이나 동기화 스크립트가 바뀔 때
# - 바뀐 게 있을 때만 사이트를 다시 만들어 저장(→ GitHub Pages가 자동으로 다시 배포)
name: 갤러리 동기화

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sync-gallery.yml"
      - "tools/sync_imweb.py"

permissions:
  contents: write

concurrency:
  group: sync-gallery
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 아임웹 상품 가져오기
        run: python3 tools/sync_imweb.py
      - name: 사이트 다시 만들기
        run: python3 tools/build.py
      - name: 바뀐 게 있으면 저장
        run: |
          rm -rf tools/__pycache__
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "welle-gallery-sync"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "갤러리 자동 동기화 (아임웹 상품)"
            git push
          else
            echo "변경 없음"
          fi
